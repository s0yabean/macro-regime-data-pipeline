# Series catalog: the single source of truth for what the pipeline ingests.
#
# Every series declares its native frequency and a release lag. The lag is counted
# from the END of the observation period (see docs/three-clocks.md), so a monthly
# CPI print dated 2025-09-01 with release_lag_days: 14 becomes available on
# 2025-09-30 + 14 days = 2025-10-14.
#
# Optional per-series fields regime_code (R1-R4) / regime_label (Reflation, Stagflation,
# Goldilocks, Recession) let you tag assets with a growth x inflation quadrant. They are
# left blank here: which assets belong to which regime is a strategy decision, not data.
providers:
- provider_id: FRED
  provider_name: Federal Reserve Economic Data
  base_url: https://fred.stlouisfed.org
- provider_id: COINGECKO
  provider_name: CoinGecko API
  base_url: https://pro-api.coingecko.com/api/v3
- provider_id: YFINANCE
  provider_name: Yahoo Finance (yfinance)
  base_url: https://finance.yahoo.com
- provider_id: COINRANKING
  provider_name: Coinranking API (long-history crypto exports)
  base_url: https://api.coinranking.com/v2
- provider_id: MANUAL
  provider_name: Staged CSV (monthly prints copied from public releases)
  base_url: null
